<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
      body{
        background-color: rgb(149, 49, 49);
        color: white;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
      }

      input:focus{
        outline: none;
        border: 2px solid blue;
        background-color: #f0f0f0;
      }

      input[type="text"],
      input[type="password"],
      input[type="email"],
      input[type="tel"],
      input[type="age"] {
        width: 250px;
        padding: 10px;
        margin: 10px 0;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        box-sizing: border-box;
      }


      h1{
        position: absolute;
        top: 20px;
        left: 20px;
        color: aliceblue;
        font-size: 24px;
        font-family: Arial, Helvetica, sans-serif
       }

       #btn3 {
        flex: 1;
        padding: 10px;
        border: none;
        background-color: #3c4652;
        color: #bfc8d2;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.3s;
       }

       #btn3.active {
        background-color: #2ab77e;
        color: white;
       }

       #btn4{
        background-color: #2ab77e;
        color: white;
        font-size: 18px;
        border: none;
        border-radius: 3px;
        padding: 15px;
        width: 100%;
        cursor: pointer;
        letter-spacing: 1px;
       }

       .submit-btn:hover {
        background-color: #27ae60;
       }
      
       input::placeholder {
        color: #9ca3af;
       }

       .name-fields {
        gap: 10px;
       }
    
    

     #btn2{
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      position: fixed;
      right: 20px;
      bottom: 20px;
     border-radius: 10px;
     padding: 5px;
     cursor: pointer;
     background-color: #3c4652;

     }
    </style>
</head>
<body>  
    <header></header>
    <main>
      <h1>JOEYFEELS FORM FILL</h1>
        <form action="">
               <div>
                <button id="btn3" class="active">Sign Up</button>
                <button id="btn3">Log In</button>
               </div>

               <h2>Sign Up For Free</h2>
              
               <form>
                <div class="name-fields">
                  <input type="text" placeholder="First Name*" required>
                  <input type="text" placeholder="Last Name*" required>
                </div>
                <input type="email" placeholder="Email Address*" required>
                <input type="password" placeholder="Set A Password*" required>
                <div>
                <input type="tel" placeholder="+234 (9155) 404056*" required>
                <input type="age" placeholder="Age*" required>
                </div>
                </div>
                <BUtton id="btn4" type="submit" class="submit-btn">GET STARTED</BUtton>
                </div>
               </form>

             <button id="btn2" type="submit">Next Page</button>
             
        </form>
    </main>
    <footer></footer>
</body>
</html>
