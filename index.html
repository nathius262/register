<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <header></header>
    <main>
        <h1>Bbadbill Register form</h1>

            <div>

            <button type="submit">Register</button>
        </form>
    </main>
    <footer></footer>
